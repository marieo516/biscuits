<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-center mb-0">Ingrédients à acheter</h2>
    <a class="btn btn-sm btn-brown" routerLink="/panier">
      Voir le panier ({{ cartCount }})
    </a>
  </div>

  @if (isLoading) {
  <p class="text-center mt-5 text-brown">Chargement des ingrédients...</p>
  } @else {
  <ul class="list-group list-group-flush mt-3">
    @for (ingredient of ingredients; track ingredient.id) {
    <li class="list-group-item d-flex justify-content-between align-items-center py-3"
      style="background-color: transparent; border-bottom: 1px solid rgba(0,0,0,0.1);">
      <span>{{ ingredient.name }}</span>
      <div class="d-flex align-items-center gap-3">
        <span>{{ ingredient.price | currency:'CAD':'symbol-narrow':'1.2-2' }}</span>
        <button class="btn btn-sm btn-outline-brown" (click)="addToPanier(ingredient)">Ajouter au panier</button>
      </div>
    </li>
    }
  </ul>
  }

</div>

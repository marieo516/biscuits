<div class="container mt-4">
  <div class="row justify-content-center align-items-center">

    <div class="col-sm-4 text-center">
      <div style="font-size: 80px">🛒</div>
    </div>

    <div class="col-sm-6">
      <form (ngSubmit)="onSubmit(f)" #f="ngForm">
        <div class="form-group">
          <label for="name">Nom de l'ingrédient</label>
          <input type="text" id="name" class="form-control" name="name" ngModel required>
        </div>
        <div class="form-group">
          <label for="price">Prix de l'ingrédient</label>
          <input type="number" id="price" class="form-control" name="price" ngModel required>
        </div>
        <button class="btn mt-4" type="submit" [disabled]="f.invalid">Enregistrer</button>
      </form>
    </div>

  </div>

  @if (isSaving) {
  <p class="text-center mt-3 text-muted text-brown">Ingrédient en cours d'ajout...</p>
  }
</div>
